name: Infrastructure quality

on:
  pull_request:
  push:
    branches: [dev, qa, main]

jobs:
  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-password
      APP_DB_PASSWORD: ci-app-password-0123456789-abcdef
      JWT_SECRET: ci-only-secret-with-at-least-32-random-bytes
      EXPO_PUBLIC_API_URL: /api
      EXPO_PUBLIC_WS_URL: /ws
      EXPO_PUBLIC_STUDENT_LINK_BASE_URL: /
    steps:
      - uses: actions/checkout@v4
        with:
          path: Docker-Infra-Guardian-Escolar
      - uses: actions/checkout@v4
        with:
          repository: GPS-Guardian-Escolar/Backend-Guardian-Escolar
          ref: dev
          path: Backend-Guardian-Escolar
      - uses: actions/checkout@v4
        with:
          repository: GPS-Guardian-Escolar/DB-Structure-Guardian-Escolar
          ref: dev
          path: DB-Structure-Guardian-Escolar
      - uses: actions/checkout@v4
        with:
          repository: GPS-Guardian-Escolar/Fronted-GuardianEscolar-
          ref: develop
          path: Fronted-GuardianEscolar-
      - working-directory: Docker-Infra-Guardian-Escolar
        run: docker compose config --quiet
      - working-directory: Docker-Infra-Guardian-Escolar
        run: docker compose build
      - working-directory: Docker-Infra-Guardian-Escolar
        run: docker compose up -d
      - name: Verify running stack
        working-directory: Docker-Infra-Guardian-Escolar
        run: |
          docker compose ps
          timeout 120s bash -c 'until [ "$(docker inspect --format="{{.State.Health.Status}}" gps_guardian_escolar_backend 2>/dev/null)" = "healthy" ]; do sleep 5; done'
          curl --fail http://localhost:8080/api/health
          timeout 60s bash -c 'until [ "$(docker inspect --format="{{.State.Health.Status}}" gps_guardian_escolar_frontend 2>/dev/null)" = "healthy" ]; do sleep 5; done'
          curl --fail http://localhost:8081/
      - if: always()
        working-directory: Docker-Infra-Guardian-Escolar
        run: docker compose down -v
